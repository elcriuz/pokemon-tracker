name: CardScanner
options:
  bundleIdPrefix: at.mxr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  CardScanner:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: CardScanner
        NSCameraUsageDescription: "Zum Scannen von Pokémon-Karten wird die Kamera benötigt."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Prototype: allow cleartext HTTP to the LAN backend (http://192.168.1.91:8088).
        # In production use HTTPS and drop this.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: at.mxr.cardscanner
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
